[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-task-assistant"
version = "0.1.0"
description = "First increment of an AI knowledge and task assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2.0",
    "fastapi>=0.115,<1.0",
    "openai>=1.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0,<6.0",
]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

